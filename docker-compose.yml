services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: operaattori
      MARIADB_USER: operaattori
      MARIADB_PASSWORD: operaattori
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 4s
      timeout: 4s
      retries: 15

  app:
    build: .
    command: php -S 0.0.0.0:8090 -t public
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: operaattori
      DB_USER: operaattori
      DB_PASSWORD: operaattori
      APP_DEBUG: "true"
    ports:
      - "8090:8090"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
